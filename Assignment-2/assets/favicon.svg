<!-- assets/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Site symbol">
  <defs>
    
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5966f"/>
      <stop offset="1" stop-color="#c9ab86"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- Rounded tile background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#g)"/>

  <!-- Minimal “spark”/innovation symbol: crisp at small sizes -->
  <!-- A diamond + two offset bars to suggest motion/engineering -->
  <g fill="#ffffff" filter="url(#s)">
    <path d="M32 17 41 26 32 35 23 26 32 17Z"/>        <!-- diamond core -->
    <rect x="18" y="38" width="28" height="4" rx="2"/> <!-- bar 1 -->
    <rect x="22" y="46" width="20" height="4" rx="2"/> <!-- bar 2 -->
  </g>
</svg>
