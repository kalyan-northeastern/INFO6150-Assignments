<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feedback Form</title>
    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            background: #f6f7fb;
            margin: 0;
            padding: 24px
        }
        
        .card {
            max-width: 720px;
            margin: auto;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .08)
        }
        
        .row {
            display: grid;
            gap: 12px
        }
        
        label {
            font-size: .95rem
        }
        
        input,
        select,
        textarea,
        button {
            font: inherit;
            padding: 10px;
            border: 1px solid #d5d9e0;
            border-radius: 8px
        }
        
        .error {
            color: #c62828;
            font-size: .85rem;
            margin-top: 4px;
            display: none
        }
        
        button[disabled] {
            opacity: .5;
            cursor: not-allowed
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px
        }
        
        th,
        td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: left
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Feedback Form</h1>

        <button type="button" id="aiBtn">🤖 AI Help</button>

        <form id="feedbackForm" novalidate class="row">
            <div>
                <label for="firstName">First name *</label>
                <input id="firstName" required aria-required="true" />
                <div class="error" id="err-firstName"></div>
            </div>
            <div>
                <label for="lastName">Last name *</label>
                <input id="lastName" required aria-required="true" />
                <div class="error" id="err-lastName"></div>
            </div>
            <div>
                <label for="emailId">Email (@northeastern.edu) *</label>
                <input id="emailId" required aria-required="true" />
                <div class="error" id="err-emailId"></div>
            </div>
            <div>
                <label for="phoneNumber">Phone (XXX) XXX-XXXX *</label>
                <input id="phoneNumber" required aria-required="true" />
                <div class="error" id="err-phoneNumber"></div>
            </div>
            <div>
                <label for="zipcode">Zip *</label>
                <input id="zipcode" required aria-required="true" />
                <div class="error" id="err-zipcode"></div>
            </div>
            <div>
                <label for="streetAddress1">Street Address 1 *</label>
                <input id="streetAddress1" required aria-required="true" />
                <div class="error" id="err-streetAddress1"></div>
            </div>
            <div>
                <label for="streetAddress2">Street Address 2 (optional, max 20)</label>
                <input id="streetAddress2" maxlength="20" />
                <div class="error" id="err-streetAddress2"></div>
                <div id="addr2Count" style="font-size:.8rem;color:#555"></div>
            </div>
            <div>
                <label for="category">Category *</label>
                <select id="category" required aria-required="true">
      <option value="">Select…</option>
      <option>General</option><option>Support</option><option>Billing</option>
      <option>Admissions</option><option>Housing</option>
    </select>
                <div class="error" id="err-category"></div>
            </div>
            <div id="dynamicArea"></div>
            <div>
                <label for="comments">Comments *</label>
                <textarea id="comments" required aria-required="true" rows="4"></textarea>
                <div class="error" id="err-comments"></div>
            </div>
            <div style="display:flex;gap:8px">
                <button id="submitBtn" type="submit" disabled>Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>

        <div id="results"></div>

        <script>
            const f = (id) => document.getElementById(id);
            const patterns = {
                name: /^[A-Za-z][A-Za-z\s'-]{1,49}$/,
                email: /^[^@\s]+@northeastern\.edu$/i,
                phone: /^\(\d{3}\)\s\d{3}-\d{4}$/,
                zip: /^\d{5}(-\d{4})?$/
            };
            const req = (v) => v.trim().length > 0;

            function setErr(id, msg) {
                const el = f("err-" + id);
                if (!el) return;
                el.textContent = msg || "";
                el.style.display = msg ? "block" : "none";
            }

            function validate() {
                let ok = true;
                [
                    ["firstName", "First name"],
                    ["lastName", "Last name"]
                ].forEach(([id, label]) => {
                    const v = f(id).value;
                    const good = req(v) && patterns.name.test(v);
                    setErr(id, good ? "" : `${label} must be letters (2–50).`);
                    ok = ok && good;
                }); {
                    const v = f("emailId").value;
                    const good = req(v) && patterns.email.test(v);
                    setErr("emailId", good ? "" : "Use your @northeastern.edu email.");
                    ok = ok && good;
                } {
                    const v = f("phoneNumber").value;
                    const good = req(v) && patterns.phone.test(v);
                    setErr("phoneNumber", good ? "" : "Format: (123) 456-7890");
                    ok = ok && good;
                } {
                    const v = f("zipcode").value;
                    const good = req(v) && patterns.zip.test(v);
                    setErr("zipcode", good ? "" : "Zip must be 12345 or 12345-6789");
                    ok = ok && good;
                } {
                    const v = f("streetAddress1").value;
                    const good = req(v);
                    setErr("streetAddress1", good ? "" : "Required.");
                    ok = ok && good;
                } {
                    const v = f("category").value;
                    const good = req(v);
                    setErr("category", good ? "" : "Pick a category.");
                    ok = ok && good;
                } {
                    const v = f("comments").value;
                    const good = req(v) && v.trim().length >= 5;
                    setErr("comments", good ? "" : "Enter at least 5 chars.");
                    ok = ok && good;
                }
                const dyn = f("dynText");
                if (dyn && dyn.hasAttribute("data-required")) {
                    const good = req(dyn.value) && dyn.value.length >= 3;
                    setErr("dynText", good ? "" : "Enter at least 3 chars.");
                    ok = ok && good;
                }
                f("submitBtn").disabled = !ok;
            }
            document.addEventListener("input", validate);
            document.addEventListener("change", validate);
            document.addEventListener("DOMContentLoaded", validate);

            f("phoneNumber").addEventListener("input", (e) => {
                const d = e.target.value.replace(/\D/g, "").slice(0, 10);
                let out = d;
                if (d.length > 6) out = `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
                else if (d.length > 3) out = `(${d.slice(0,3)}) ${d.slice(3)}`;
                else if (d.length > 0) out = `(${d}`;
                e.target.value = out;
            });
            f("zipcode").addEventListener("input", (e) => {
                const d = e.target.value.replace(/\D/g, "").slice(0, 9);
                e.target.value = d.length > 5 ? `${d.slice(0,5)}-${d.slice(5)}` : d;
            });
            const addr2 = f("streetAddress2"),
                counter = f("addr2Count");
            if (addr2 && counter) {
                addr2.addEventListener("input", () => {
                    counter.textContent = `${addr2.value.length}/20`;
                });
                counter.textContent = "0/20";
            }

            const dynamicArea = f("dynamicArea");

            function renderDynamic(category) {
                dynamicArea.innerHTML = "";
                if (!category) return;
                const wrap = document.createElement("div");
                const cbId = "dynCheck";
                wrap.innerHTML = `
    <label style="display:flex;gap:8px;align-items:center">
      <input type="checkbox" id="${cbId}"> Additional details for ${category}
    </label>
    <div id="dynTextWrap" style="margin-top:8px;display:none">
      <label for="dynText">Please specify *</label>
      <input id="dynText" />
      <div class="error" id="err-dynText"></div>
    </div>`;
                dynamicArea.appendChild(wrap);
                const cb = f(cbId);
                const txtWrap = f("dynTextWrap");
                const txt = f("dynText");
                cb.addEventListener("change", () => {
                    if (cb.checked) {
                        txtWrap.style.display = "block";
                        txt.setAttribute("data-required", "1");
                    } else {
                        txtWrap.style.display = "none";
                        txt.removeAttribute("data-required");
                        setErr("dynText", "");
                    }
                    validate();
                });
            }
            f("category").addEventListener("change", e => renderDynamic(e.target.value));

            const submitted = [];

            function renderTable() {
                if (submitted.length === 0) {
                    f("results").innerHTML = "";
                    return;
                }
                const head = `<thead><tr><th>Time</th><th>First</th><th>Last</th><th>Email</th><th>Phone</th><th>Zip</th><th>Addr1</th><th>Addr2</th><th>Category</th><th>Details</th><th>Comments</th></tr></thead>`;
                const rows = submitted.map(r => `<tr><td>${r.time}</td><td>${r.first}</td><td>${r.last}</td><td>${r.email}</td><td>${r.phone}</td><td>${r.zip}</td><td>${r.addr1}</td><td>${r.addr2||""}</td><td>${r.cat||""}</td><td>${r.details||""}</td><td>${r.comments}</td></tr>`).join("");
                f("results").innerHTML = `<table>${head}<tbody>${rows}</tbody></table>`;
            }
            document.getElementById("feedbackForm").addEventListener("submit", (e) => {
                e.preventDefault();
                validate();
                if (f("submitBtn").disabled) return;
                submitted.push({
                    time: new Date().toLocaleString(),
                    first: f("firstName").value.trim(),
                    last: f("lastName").value.trim(),
                    email: f("emailId").value.trim(),
                    phone: f("phoneNumber").value.trim(),
                    zip: f("zipcode").value.trim(),
                    addr1: f("streetAddress1").value.trim(),
                    addr2: f("streetAddress2").value.trim(),
                    cat: f("category").value,
                    details: (f("dynText") && f("dynText").hasAttribute("data-required")) ? f("dynText").value.trim() : "",
                    comments: f("comments").value.trim()
                });
                renderTable();
                e.target.reset();
                dynamicArea.innerHTML = "";
                if (counter) counter.textContent = "0/20";
                validate();
            });
            document.getElementById("feedbackForm").addEventListener("reset", () => {
                dynamicArea.innerHTML = "";
                document.querySelectorAll(".error").forEach(e => {
                    e.textContent = "";
                    e.style.display = "none";
                });
                if (counter) counter.textContent = "0/20";
                setTimeout(validate, 0);
            });

            const faq = {
                email: "Use your @northeastern.edu email only.",
                phone: "Phone must be in format (123) 456-7890.",
                zip: "Zip can be 12345 or 12345-6789.",
                required: "Fields with * must be filled before you can submit.",
                address2: "Street Address 2 is optional; max 20 chars."
            };
            f("aiBtn").addEventListener("click", () => {
                const q = prompt("Ask a keyword (email, phone, zip, required, address2):", "");
                if (!q) return;
                alert(faq[q.toLowerCase()] || "Try one of: email, phone, zip, required, address2");
            });
        </script>

    </main>
</body>

</html>
