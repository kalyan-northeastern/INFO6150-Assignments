<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feedback Form</title>
    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            background: #f6f7fb;
            margin: 0;
            padding: 24px
        }
        
        .card {
            max-width: 720px;
            margin: auto;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .08)
        }
        
        .row {
            display: grid;
            gap: 12px
        }
        
        label {
            font-size: .95rem
        }
        
        input,
        select,
        textarea,
        button {
            font: inherit;
            padding: 10px;
            border: 1px solid #d5d9e0;
            border-radius: 8px
        }
        
        .error {
            color: #c62828;
            font-size: .85rem;
            margin-top: 4px;
            display: none
        }
        
        button[disabled] {
            opacity: .5;
            cursor: not-allowed
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px
        }
        
        th,
        td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: left
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Feedback Form</h1>

        <form id="feedbackForm" novalidate class="row">
            <div>
                <label for="firstName">First name *</label>
                <input id="firstName" required />
                <div class="error" id="err-firstName"></div>
            </div>

            <div>
                <label for="lastName">Last name *</label>
                <input id="lastName" required />
                <div class="error" id="err-lastName"></div>
            </div>

            <div>
                <label for="emailId">Email (@northeastern.edu) *</label>
                <input id="emailId" required />
                <div class="error" id="err-emailId"></div>
            </div>

            <div>
                <label for="phoneNumber">Phone (XXX) XXX-XXXX *</label>
                <input id="phoneNumber" required />
                <div class="error" id="err-phoneNumber"></div>
            </div>

            <div>
                <label for="zipcode">Zip *</label>
                <input id="zipcode" required />
                <div class="error" id="err-zipcode"></div>
            </div>

            <div>
                <label for="streetAddress1">Street Address 1 *</label>
                <input id="streetAddress1" required />
                <div class="error" id="err-streetAddress1"></div>
            </div>

            <div>
                <label for="streetAddress2">Street Address 2 (optional, max 20)</label>
                <input id="streetAddress2" maxlength="20" />
                <div class="error" id="err-streetAddress2"></div>
                <div id="addr2Count" style="font-size:.8rem;color:#555"></div>
            </div>

            <div>
                <label for="category">Category *</label>
                <select id="category" required>
      <option value="">Select…</option>
      <option>General</option><option>Support</option><option>Billing</option>
      <option>Admissions</option><option>Housing</option>
    </select>
                <div class="error" id="err-category"></div>
            </div>

            <div id="dynamicArea"></div>

            <div>
                <label for="comments">Comments *</label>
                <textarea id="comments" required rows="4"></textarea>
                <div class="error" id="err-comments"></div>
            </div>

            <div style="display:flex;gap:8px">
                <button id="submitBtn" type="submit" disabled>Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>

        <div id="results"></div>
        <script>
            // wiring later
        </script>
    </main>
</body>

</html>
