<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feedback Form</title>
    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            background: #f6f7fb;
            margin: 0;
            padding: 24px
        }
        
        .card {
            max-width: 720px;
            margin: auto;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .08)
        }
        
        .row {
            display: grid;
            gap: 12px
        }
        
        label {
            font-size: .95rem
        }
        
        input,
        select,
        textarea,
        button {
            font: inherit;
            padding: 10px;
            border: 1px solid #d5d9e0;
            border-radius: 8px
        }
        
        button[disabled] {
            opacity: .5;
            cursor: not-allowed
        }
        
        .error {
            color: #c62828;
            font-size: .85rem;
            margin-top: 4px;
            display: none
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px
        }
        
        th,
        td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: left
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Feedback Form</h1>
        <!-- content will grow in later commits -->
    </main>
</body>

</html>
